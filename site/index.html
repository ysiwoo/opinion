<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설문 응답 타임라인</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --border: #e3e5e9;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #4f46e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 2rem;
    font-size: 0.9rem;
  }
  #status {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .timeline {
    position: relative;
    padding-left: 1.5rem;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: var(--border);
  }
  .entry {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .entry.flagged {
    border-color: #f59e0b;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }
  .badge {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-topic {
    background: #eef2ff;
    color: var(--accent);
  }
  .badge-positive {
    background: #dcfce7;
    color: #16a34a;
  }
  .badge-negative {
    background: #fee2e2;
    color: #dc2626;
  }
  .badge-neutral {
    background: #f3f4f6;
    color: #6b7280;
  }
  .badge-profanity {
    background: #fef3c7;
    color: #b45309;
  }
  .entry::before {
    content: "";
    position: absolute;
    left: -1.5rem;
    top: 1.3rem;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }
  .entry-time {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }
  .answer-row {
    display: flex;
    gap: 0.5rem;
    padding: 0.3rem 0;
    border-top: 1px dashed var(--border);
  }
  .answer-row:first-of-type {
    border-top: none;
  }
  .answer-question {
    flex: 0 0 auto;
    font-weight: 600;
    min-width: 30%;
  }
  .answer-value {
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 2rem 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  .admin-toggle {
    font-size: 0.8rem;
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    cursor: pointer;
  }
  .admin-toggle.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .hide-btn, .restore-btn {
    font-size: 0.75rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    cursor: pointer;
    margin-left: auto;
  }
  .hide-btn:hover, .restore-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .entry-time-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .hidden-panel {
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }
  .hidden-panel h2 {
    font-size: 1rem;
    margin: 0 0 0.5rem;
  }
  .hidden-panel .hint {
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0 0 0.75rem;
  }
  .hidden-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0;
    border-top: 1px dashed var(--border);
    font-size: 0.85rem;
  }
  .hidden-item:first-of-type {
    border-top: none;
  }
  .hidden-item .summary {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
  }
  .profanity-panel {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }
  .profanity-panel h2 {
    font-size: 1rem;
    margin: 0 0 0.5rem;
    color: #b45309;
  }
  .profanity-panel .hint {
    color: #92400e;
    font-size: 0.8rem;
    margin: 0 0 0.75rem;
  }
  .profanity-panel .entry:last-child {
    margin-bottom: 0;
  }
  .toolbar-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .search-row {
    margin-bottom: 1rem;
  }
  .search-input {
    width: 100%;
    padding: 0.55rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
    box-sizing: border-box;
  }
  .word-cloud-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem 1.25rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .word-cloud-panel h2 {
    font-size: 1rem;
    margin: 0 0 1rem;
    text-align: left;
  }
  .word-cloud {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 0.3rem 0.8rem;
  }
  .word-cloud-item {
    color: var(--accent);
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>설문 응답 타임라인</h1>
    <p class="subtitle">구글폼 제출 내역이 최신순으로 표시됩니다.</p>
    <div class="toolbar">
      <p id="status" style="margin:0;"></p>
      <div class="toolbar-actions">
        <button id="wordCloudToggle" class="admin-toggle" type="button">워드클라우드</button>
        <button id="csvDownload" class="admin-toggle" type="button">CSV 다운로드</button>
        <button id="adminToggle" class="admin-toggle" type="button">관리자 모드</button>
      </div>
    </div>
    <div class="search-row">
      <input type="search" id="searchInput" class="search-input" placeholder="의견 내용 검색...">
    </div>
    <div id="wordCloudPanel" class="word-cloud-panel" hidden></div>
    <div id="hiddenPanel" class="hidden-panel" hidden></div>
    <div id="profanityPanel" class="profanity-panel" hidden></div>
    <div id="timeline" class="timeline"></div>
  </div>

  <script>
    // fetch가 실패했을 때(예: 로컬 파일 미리보기) 대신 보여줄 샘플 데이터
    var SAMPLE_DATA = [
      {
        timestamp: "2026-08-30T09:15:00.000Z",
        answers: {
          "이름": "홍길동",
          "만족도": "매우 만족",
          "의견": "샘플 데이터입니다. data/responses.json을 불러오지 못했을 때 표시됩니다."
        }
      },
      {
        timestamp: "2026-08-31T02:40:00.000Z",
        answers: {
          "이름": "김철수",
          "만족도": "보통",
          "의견": "실제 배포 환경에서는 이 대신 실제 응답이 표시됩니다."
        },
        classification: {
          topic: "샘플",
          sentiment: "neutral",
          hasProfanity: false,
          profanityNote: ""
        }
      }
    ];

    var SENTIMENT_LABEL = { positive: "긍정", negative: "부정", neutral: "중립" };

    // Apps Script 웹 앱 배포 후 발급되는 /exec URL. 비워두면 관리자 모드(숨기기/복원)가 비활성화된다.
    var HIDE_API_URL = "https://script.google.com/macros/s/AKfycbwBjXa2wWHpm-RsEgKZAlCQL3EAOBNkqkj58Yc9Nisx8KouszAnvMeyp6ChLb2tnt2CFA/exec";
    var HIDDEN_RETENTION_DAYS = 10;

    var allEntries = [];
    var isAdmin = false;
    var adminPassword = null;
    var currentIsSample = false;
    var searchQuery = "";
    var wordCloudOpen = false;

    function callAdminApi(payload) {
      return fetch(HIDE_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).then(function (res) {
        return res.json();
      });
    }

    function formatTimestamp(value) {
      var date = new Date(value);
      if (isNaN(date.getTime())) return value;
      return date.toLocaleString("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function hasProfanity(entry) {
      return !!(entry.classification && entry.classification.hasProfanity);
    }

    function buildEntryCard(entry) {
      var card = document.createElement("div");
      card.className = "entry";

      var classification = entry.classification;
      if (hasProfanity(entry)) {
        card.classList.add("flagged");
      }

      var timeRow = document.createElement("div");
      timeRow.className = "entry-time-row";

      var time = document.createElement("div");
      time.className = "entry-time";
      time.textContent = formatTimestamp(entry.timestamp);
      timeRow.appendChild(time);

      if (isAdmin) {
        var hideBtn = document.createElement("button");
        hideBtn.type = "button";
        hideBtn.className = "hide-btn";
        hideBtn.textContent = "숨기기";
        hideBtn.addEventListener("click", function (targetEntry) {
          return function () {
            hideEntryAction(targetEntry);
          };
        }(entry));
        timeRow.appendChild(hideBtn);
      }

      card.appendChild(timeRow);

      if (classification) {
        var badges = document.createElement("div");
        badges.className = "badges";

        if (classification.topic) {
          var topicBadge = document.createElement("span");
          topicBadge.className = "badge badge-topic";
          topicBadge.textContent = classification.topic;
          badges.appendChild(topicBadge);
        }

        if (classification.sentiment) {
          var sentimentBadge = document.createElement("span");
          sentimentBadge.className = "badge badge-" + classification.sentiment;
          sentimentBadge.textContent = SENTIMENT_LABEL[classification.sentiment] || classification.sentiment;
          badges.appendChild(sentimentBadge);
        }

        if (classification.hasProfanity) {
          var profanityBadge = document.createElement("span");
          profanityBadge.className = "badge badge-profanity";
          profanityBadge.textContent = "⚠ 비속어 포함";
          profanityBadge.title = classification.profanityNote || "";
          badges.appendChild(profanityBadge);
        }

        card.appendChild(badges);
      }

      var answers = entry.answers || {};
      Object.keys(answers).forEach(function (question) {
        var row = document.createElement("div");
        row.className = "answer-row";

        var q = document.createElement("div");
        q.className = "answer-question";
        q.textContent = question;

        var v = document.createElement("div");
        v.className = "answer-value";
        var value = answers[question];
        v.textContent = Array.isArray(value) ? value.join(", ") : value;

        row.appendChild(q);
        row.appendChild(v);
        card.appendChild(row);
      });

      return card;
    }

    function renderTimeline(entries, isSample) {
      var container = document.getElementById("timeline");
      var status = document.getElementById("status");
      container.innerHTML = "";

      // 비속어로 분류된 항목은 타임라인에서 빼고, 아래 별도 칸(renderProfanityPanel)에서만 보여준다.
      var visible = entries.filter(function (entry) {
        return !hasProfanity(entry);
      });

      if (isSample) {
        status.textContent = "data/responses.json을 불러오지 못해 샘플 데이터를 표시 중입니다.";
      } else {
        status.textContent = "총 " + visible.length + "건의 응답";
      }

      if (!visible.length) {
        container.innerHTML = '<p class="empty">아직 응답이 없습니다.</p>';
        return;
      }

      var sorted = visible.slice().sort(function (a, b) {
        return new Date(b.timestamp) - new Date(a.timestamp);
      });

      sorted.forEach(function (entry) {
        container.appendChild(buildEntryCard(entry));
      });
    }

    function renderProfanityPanel(entries) {
      var panel = document.getElementById("profanityPanel");
      panel.innerHTML = "";

      var flagged = entries.filter(hasProfanity).sort(function (a, b) {
        return new Date(b.timestamp) - new Date(a.timestamp);
      });

      if (!flagged.length) {
        panel.hidden = true;
        return;
      }

      panel.hidden = false;

      var title = document.createElement("h2");
      title.textContent = "⚠ 비속어 포함 의견 (" + flagged.length + "건)";
      panel.appendChild(title);

      var hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = "자동 분류로 비속어가 감지되어 이 칸에 따로 모았습니다.";
      panel.appendChild(hint);

      flagged.forEach(function (entry) {
        panel.appendChild(buildEntryCard(entry));
      });
    }

    function matchesSearch(entry) {
      if (!searchQuery) return true;
      var answers = entry.answers || {};
      return Object.keys(answers).some(function (q) {
        var value = answers[q];
        var text = Array.isArray(value) ? value.join(" ") : String(value == null ? "" : value);
        return text.toLowerCase().indexOf(searchQuery) !== -1 || q.toLowerCase().indexOf(searchQuery) !== -1;
      });
    }

    function getCurrentEntries() {
      return allEntries.filter(matchesSearch);
    }

    function renderAll(entries, isSample) {
      var filtered = entries.filter(matchesSearch);
      renderTimeline(filtered, isSample);
      renderProfanityPanel(filtered);
      if (wordCloudOpen) {
        renderWordCloud(filtered);
      }
    }

    function loadResponses() {
      return fetch("data/responses.json", { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("응답 파일을 불러오지 못했습니다.");
          return res.json();
        })
        .then(function (data) {
          allEntries = Array.isArray(data) ? data : [];
          currentIsSample = false;
          renderAll(allEntries, false);
        })
        .catch(function () {
          allEntries = SAMPLE_DATA;
          currentIsSample = true;
          renderAll(allEntries, true);
        });
    }

    // 간단한 한국어 불용어 목록. 완벽한 형태소 분석이 아니라
    // 공백/구두점 기준 분리 + 흔한 조사·접속사 제거 수준의 휴리스틱이다.
    var KOREAN_STOPWORDS = {
      "그리고": true, "그러나": true, "그래서": true, "하지만": true, "그런데": true,
      "정말": true, "진짜": true, "너무": true, "아주": true, "매우": true, "조금": true,
      "이거": true, "저거": true, "그거": true, "이것": true, "저것": true, "그것": true,
      "합니다": true, "해요": true, "입니다": true, "있습니다": true, "없습니다": true,
      "같아요": true, "같습니다": true, "이제": true, "그냥": true, "저는": true,
      "제가": true, "저도": true, "이건": true, "저건": true, "그건": true, "많이": true,
      "좀": true, "더": true, "이번": true, "때문에": true, "위해": true
    };

    function extractWordFrequency(entries) {
      var freq = {};
      entries.forEach(function (entry) {
        var answers = entry.answers || {};
        Object.keys(answers).forEach(function (q) {
          var value = answers[q];
          var text = Array.isArray(value) ? value.join(" ") : String(value == null ? "" : value);
          var tokens = text.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
          tokens.forEach(function (token) {
            if (token.length < 2 || KOREAN_STOPWORDS[token]) return;
            freq[token] = (freq[token] || 0) + 1;
          });
        });
      });
      return freq;
    }

    function renderWordCloud(entries) {
      var panel = document.getElementById("wordCloudPanel");
      panel.innerHTML = "";

      var title = document.createElement("h2");
      title.textContent = "워드클라우드";
      panel.appendChild(title);

      var freq = extractWordFrequency(entries);
      var words = Object.keys(freq).map(function (word) {
        return { word: word, count: freq[word] };
      });
      words.sort(function (a, b) {
        return b.count - a.count;
      });
      words = words.slice(0, 40);

      if (!words.length) {
        var empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = "표시할 단어가 없습니다.";
        panel.appendChild(empty);
        return;
      }

      var maxCount = words[0].count;
      var minCount = words[words.length - 1].count;

      var cloud = document.createElement("div");
      cloud.className = "word-cloud";

      words.forEach(function (item) {
        var span = document.createElement("span");
        span.className = "word-cloud-item";
        var ratio = maxCount === minCount ? 1 : (item.count - minCount) / (maxCount - minCount);
        var fontSize = 0.85 + ratio * 2.4;
        span.style.fontSize = fontSize.toFixed(2) + "rem";
        span.style.opacity = (0.55 + ratio * 0.45).toFixed(2);
        span.textContent = item.word;
        span.title = item.count + "회 언급";
        cloud.appendChild(span);
      });

      panel.appendChild(cloud);
    }

    function toggleWordCloud() {
      wordCloudOpen = !wordCloudOpen;
      var btn = document.getElementById("wordCloudToggle");
      var panel = document.getElementById("wordCloudPanel");
      panel.hidden = !wordCloudOpen;
      btn.classList.toggle("active", wordCloudOpen);
      if (wordCloudOpen) {
        renderWordCloud(getCurrentEntries());
      }
    }

    function escapeCsvField(value) {
      var str = value === undefined || value === null ? "" : String(value);
      if (/[",\n\r]/.test(str)) {
        str = '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    function downloadCsv() {
      var entries = getCurrentEntries();
      if (!entries.length) {
        alert("내보낼 데이터가 없습니다.");
        return;
      }

      var questionSet = [];
      entries.forEach(function (entry) {
        Object.keys(entry.answers || {}).forEach(function (q) {
          if (questionSet.indexOf(q) === -1) questionSet.push(q);
        });
      });

      var headers = ["제출시각"].concat(questionSet, ["주제", "감정", "비속어여부"]);
      var rows = [headers];

      var sorted = entries.slice().sort(function (a, b) {
        return new Date(b.timestamp) - new Date(a.timestamp);
      });

      sorted.forEach(function (entry) {
        var row = [formatTimestamp(entry.timestamp)];
        var answers = entry.answers || {};
        questionSet.forEach(function (q) {
          var value = answers[q];
          row.push(Array.isArray(value) ? value.join(", ") : (value == null ? "" : value));
        });
        var classification = entry.classification || {};
        row.push(classification.topic || "");
        row.push(classification.sentiment ? (SENTIMENT_LABEL[classification.sentiment] || classification.sentiment) : "");
        row.push(classification.hasProfanity === true ? "Y" : (classification.hasProfanity === false ? "N" : ""));
        rows.push(row);
      });

      var csvContent = rows.map(function (row) {
        return row.map(escapeCsvField).join(",");
      }).join("\r\n");

      var blob = new Blob(["﻿" + csvContent], { type: "text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "설문응답_" + new Date().toISOString().slice(0, 10) + ".csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function renderHiddenPanel(hiddenEntries) {
      var panel = document.getElementById("hiddenPanel");
      panel.innerHTML = "";

      if (!isAdmin) {
        panel.hidden = true;
        return;
      }

      panel.hidden = false;

      var title = document.createElement("h2");
      title.textContent = "숨김 의견함 (" + hiddenEntries.length + "건)";
      panel.appendChild(title);

      var hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = "숨긴 지 " + HIDDEN_RETENTION_DAYS + "일이 지나면 자동으로 완전히 삭제됩니다.";
      panel.appendChild(hint);

      if (!hiddenEntries.length) {
        var empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = "숨긴 의견이 없습니다.";
        panel.appendChild(empty);
        return;
      }

      hiddenEntries.forEach(function (entry) {
        var row = document.createElement("div");
        row.className = "hidden-item";

        var hiddenAt = new Date(entry.hiddenAt).getTime();
        var daysLeft = isNaN(hiddenAt) ? "?" : Math.max(0, HIDDEN_RETENTION_DAYS - Math.floor((Date.now() - hiddenAt) / 86400000));

        var summary = document.createElement("div");
        summary.className = "summary";
        var firstAnswer = Object.keys(entry.answers || {}).map(function (q) {
          return entry.answers[q];
        }).join(" / ");
        summary.textContent = formatTimestamp(entry.timestamp) + " · " + firstAnswer + " (삭제까지 " + daysLeft + "일)";
        row.appendChild(summary);

        var restoreBtn = document.createElement("button");
        restoreBtn.type = "button";
        restoreBtn.className = "restore-btn";
        restoreBtn.textContent = "복원";
        restoreBtn.addEventListener("click", function () {
          restoreEntryAction(entry);
        });
        row.appendChild(restoreBtn);

        panel.appendChild(row);
      });
    }

    function refreshAdminPanel() {
      callAdminApi({ action: "list", password: adminPassword })
        .then(function (result) {
          if (result.ok) {
            renderHiddenPanel(result.hidden || []);
          }
        });
    }

    function hideEntryAction(entry) {
      if (!confirm("이 의견을 숨길까요? 관리자 모드에서 언제든 복원할 수 있고, " + HIDDEN_RETENTION_DAYS + "일 뒤 자동으로 완전히 삭제됩니다.")) {
        return;
      }
      callAdminApi({ action: "hide", password: adminPassword, timestamp: entry.timestamp })
        .then(function (result) {
          if (result.ok) {
            // GitHub Pages 재배포를 기다리지 않고, 이미 아는 결과를 화면에 바로 반영한다.
            allEntries = allEntries.filter(function (e) {
              return e.timestamp !== entry.timestamp;
            });
            renderAll(allEntries, false);
            refreshAdminPanel();
          } else {
            alert("숨기기에 실패했습니다: " + (result.error || ""));
          }
        })
        .catch(function () {
          alert("요청에 실패했습니다.");
        });
    }

    function restoreEntryAction(entry) {
      callAdminApi({ action: "restore", password: adminPassword, timestamp: entry.timestamp })
        .then(function (result) {
          if (result.ok) {
            var restored = {};
            Object.keys(entry).forEach(function (key) {
              if (key !== "hiddenAt") restored[key] = entry[key];
            });
            allEntries.push(restored);
            renderAll(allEntries, false);
            refreshAdminPanel();
          } else {
            alert("복원에 실패했습니다: " + (result.error || ""));
          }
        })
        .catch(function () {
          alert("요청에 실패했습니다.");
        });
    }

    function toggleAdminMode() {
      var toggleBtn = document.getElementById("adminToggle");

      if (isAdmin) {
        isAdmin = false;
        adminPassword = null;
        toggleBtn.textContent = "관리자 모드";
        toggleBtn.classList.remove("active");
        renderAll(allEntries, false);
        renderHiddenPanel([]);
        return;
      }

      if (!HIDE_API_URL) {
        alert("관리자 기능이 아직 설정되지 않았습니다 (HIDE_API_URL 미설정).");
        return;
      }

      var pwd = prompt("관리자 비밀번호를 입력하세요");
      if (pwd === null || pwd === "") return;

      callAdminApi({ action: "verify", password: pwd })
        .then(function (result) {
          if (result.ok) {
            isAdmin = true;
            adminPassword = pwd;
            toggleBtn.textContent = "관리자 모드 ON";
            toggleBtn.classList.add("active");
            renderAll(allEntries, false);
            refreshAdminPanel();
          } else {
            alert("비밀번호가 올바르지 않습니다.");
          }
        })
        .catch(function () {
          alert("관리자 인증 요청에 실패했습니다.");
        });
    }

    document.getElementById("adminToggle").addEventListener("click", toggleAdminMode);
    document.getElementById("wordCloudToggle").addEventListener("click", toggleWordCloud);
    document.getElementById("csvDownload").addEventListener("click", downloadCsv);
    document.getElementById("searchInput").addEventListener("input", function (e) {
      searchQuery = e.target.value.trim().toLowerCase();
      renderAll(allEntries, currentIsSample);
    });

    loadResponses();
  </script>
</body>
</html>
